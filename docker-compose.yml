services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: recsys_qdrant
    restart: always
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - ./data/qdrant_storage:/qdrant/storage
    environment:
      - QDRANT__SERVICE__ENABLE_CORS=true
    networks:
      - recsys_net

  redis:
    image: redis:alpine
    container_name: recsys_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - ./data/redis_storage:/data
    command: redis-server --appendonly yes
    networks:
      - recsys_net

  prometheus:
    image: prom/prometheus:latest
    container_name: recsys_prometheus
    restart: always
    ports:
      - "9090:9090"
    volumes:
      - ./configs/prometheus.yml:/etc/prometheus/prometheus.yml
    networks:
      - recsys_net
    extra_hosts:
      - "host.docker.internal:host-gateway"

  grafana:
    image: grafana/grafana:latest
    container_name: recsys_grafana
    restart: always
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    networks:
      - recsys_net

networks:
  recsys_net:
    driver: bridge