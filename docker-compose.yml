version: '3.8'

services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: recsys_qdrant
    restart: always
    ports:
      - "6333:6333" # HTTP API и Веб-дашборд
      - "6334:6334" # gRPC API (для ультрабыстрого общения)
    volumes:
      - ./data/qdrant_storage:/qdrant/storage
    environment:
      - QDRANT__SERVICE__ENABLE_CORS=true