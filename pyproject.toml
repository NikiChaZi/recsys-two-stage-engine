[project]
name = "recsys-engine"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12, <3.13"
dependencies = [
    "polars>=0.20.0",
    "pyarrow>=14.0.0",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "tqdm>=4.66.0",
    "torch",
    "catboost>=1.2.0",
    "qdrant-client>=1.10.0",
    "redis>=5.0.0",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "prometheus-fastapi-instrumentator>=7.0.0",
    "onnx>=1.16.0",
    "onnxruntime>=1.18.0",
    "locust>=2.24.0",
]

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu124" }]

[tool.pytest.ini_options]
pythonpath = ["."]