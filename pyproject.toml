[project]
name = "recsys-engine"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12, <3.13"
dependencies = [
    "catboost>=1.2.10",
    "fastapi>=0.143.2",
    "locust>=2.46.7",
    "numpy>=2.5.4",
    "polars>=2.0.0",
    "pyarrow>=26.0.0",
    "qdrant-client>=1.19.1",
    "scipy>=1.18.1",
    "torch",
    "tqdm>=4.70.1",
    "uvicorn[standard]>=0.54.0",
]

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu124" }]